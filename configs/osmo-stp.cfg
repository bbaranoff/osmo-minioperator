!
! osmo-stp.cfg - OsmoSTP (SS7 Signal Transfer Point) for operator 1.
! Template: placeholders are substituted by apply_config_templates()
! (generate_configs.sh).
!
! Topology:
!   [BSC 1.1.3] -+
!                     +- STP 1.1.2 @ 127.0.0.1:2905 (local listener)
!   [MSC 1.1.1] -+        |
!                              | ASP client -> inter-STP 127.0.0.1:2908
!                              v
!                       [Inter-STP 0.0.0]
!
! BSC and MSC connect to the STP over loopback (same container). The listener
! is bound to loopback only, so it is up before Docker attaches the private
! network.
!
log file /var/log/osmocom/osmo-stp.log
 logging color 1
 logging timestamp 1
 logging filter all 1
 logging print category-hex 0
 logging print category 1
 logging print extended-timestamp 1
 logging print level 1
 logging print file basename
 logging level lss7 info
 logging level lsccp info
 logging level lm3ua info
 logging level linp notice
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging print extended-timestamp 1
 logging print level 1
 logging print file basename
 logging level lss7 info
 logging level lsccp info
 logging level lm3ua info
 logging level linp notice
!
stats interval 5
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code 1.1.2
!
 ! -- Local listener (BSC/MSC connect via 127.0.0.1 / 127.0.0.2) -----------
 xua rkm routing-key-allocation dynamic-permitted
 listen m3ua 2905
  accept-asp-connections dynamic-permitted
  local-ip 127.0.0.1
  local-ip 127.0.0.2
!
 ! -- Client link to the central inter-STP ----------------------------------
 asp asp-to-inter 2908 2910 m3ua
  remote-ip 127.0.0.1
  local-ip 0.0.0.0
  role asp
  sctp-role client
  shutdown
!
 as as-inter m3ua
  asp asp-to-inter
  routing-key 150 1.1.2
  traffic-mode override
!
 ! -- Routing: local routes (BSC/MSC) are created dynamically by accept-asp;
 ! -- everything else goes to the inter-STP.
 route-table system
  update route 0.0.0 0.0.0 linkset as-inter
