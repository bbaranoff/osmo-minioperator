# mobile.cfg - config osmocom-bb "mobile", mode DSP, UN SEUL operateur.
# Valeurs figees (op=1, node=1) : IMSI 001010001000001, Ki ...dd 01 01,
# SMS-SC +3366612340001, ARFCN 514 (stick), IMEI 358925000000014.
#
# MODE DSP / VOCODEUR ROM (BANC_VOCODEUR=rom, defaut de c54x_exe/run.sh) :
#   tch-voice : ecrit ici en "io-handler gapk" + "io-tch-format ti". A
#     l'execution, run.sh derive la variante l1phy (io-handler l1phy, sans
#     io-tch-format ni ALSA) : seul mode ou le firmware leve les mutes du
#     vocodeur (le DSP TI vocode : calypso_vsp.c, CALYPSO_VSP=1).
#   tch-data  : "io-handler unix-sock" + "io-tch-format ti" (CSD 9600 8N1).
#   "ti" = layout Texas Instruments des vrais Calypso (le DSP vocode), a ne PAS
#   confondre avec "rtp" (setup gr-gsm, ou pont.py code en libosmocoding).
!
line vty
 no login
 bind 127.0.0.1 4247
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
!
log stderr
 logging filter all 1
 logging color 1
 logging timestamp 1
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
log gsmtap 127.0.0.1
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
ms 1
 layer2-socket /tmp/osmocom_l2
 sap-socket /tmp/osmocom_sap
 sim test
 network-selection-mode auto
 imei 358925000000014 0
 imei-fixed
 no emergency-imsi
 sms-service-center +3366612340001
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick 514
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  no r-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi 001010001000001
  ki comp128 00 11 22 33 44 55 66 77 88 99 aa bb cc dd 01 01
  no barred-access
  rplmn 001 01
 tch-voice
  io-handler l1phy
 tch-data
  io-handler unix-sock
  io-tch-format ti
  unix-socket /tmp/ms_data
  call-params type-rate 71
  call-params ce transparent
  call-params async
  call-params async nr-stop-bits 1
  call-params async nr-data-bits 8
  call-params async parity none
 no shutdown
!
! GSMTAP configuration
!
gsmtap
 remote-host 127.0.0.1
 no local-host
 lchan sacch
 lchan lsacch
 lchan sacch/4
 lchan sacch/8
 lchan sacch/f
 lchan sacch/h
 lchan unknown
 lchan bcch
 lchan ccch
 lchan rach
 lchan agch
 lchan pch
 lchan sdcch
 lchan sdcch/4
 lchan sdcch/8
 lchan facch/f
 lchan facch/h
 lchan pacch
 lchan cbch
 lchan pdch
 lchan pttch
 lchan tch/f
 lchan tch/h
 category gprs dl-unknown
 category gprs dl-dummy
 category gprs dl-ctrl
 category gprs dl-data-gprs
 category gprs dl-data-egprs
 category gprs ul-unknown
 category gprs ul-dummy
 category gprs ul-ctrl
 category gprs ul-data-gprs
 category gprs ul-data-egprs
end

